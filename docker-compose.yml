services:
  postgres:
    image: postgres:16
    restart: always
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librarydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  authors-mock:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/authors:/home/wiremock
    ports:
      - "8081:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s


  sections-mock:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/sections:/home/wiremock
    ports:
      - "8082:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  book-service:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      authors-mock:
        condition: service_healthy
      sections-mock:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-librarydb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CLIENTS_AUTHORS_BASE_URL: http://authors-mock:8080
      CLIENTS_SECTIONS_BASE_URL: http://sections-mock:8080
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata: