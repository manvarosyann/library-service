services:
  discovery-server:
    build:
      context: ./discovery-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16
    restart: always
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librarydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  authors-mock:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/authors:/home/wiremock
    ports:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  authors-mock-b:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/authors/b:/home/wiremock
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sections-mock:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/sections:/home/wiremock
    ports:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sections-mock-b:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/sections/b:/home/wiremock
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  auth-service:
    build: ./auth-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      BOOKS_JWT_SECRET: "change-me-dev-secret-min-32-chars-min"
      EUREKA_CLIENT_ID: digital-library
      BOOKS_SERVICE_CLIENT_SECRET: dev-secret
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - discovery-server

  book-service:
    build:
      context: ./digital-library
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker

      #DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-librarydb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      #Eureka for book-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      CLIENTS_AUTHORS_BASE_URL: lb://authors
      CLIENTS_SECTIONS_BASE_URL: lb://sections

      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_AUTHORS_0_URI: http://authors-mock:8080
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_AUTHORS_1_URI: http://authors-mock-b:8080
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_SECTIONS_0_URI: http://sections-mock:8080
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_SECTIONS_1_URI: http://sections-mock-b:8080

      BOOKS_JWT_SECRET: "super-secret-key-change-me-32-chars-min"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_SECRET_KEY: ${BOOKS_JWT_SECRET}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWS_ALGORITHM: HS256

      AUTH_BASE_URL: http://auth-service:8081

      BOOKS_SERVICE_CLIENT_SECRET: dev-secret
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
          condition: service_healthy
      authors-mock:
          condition: service_healthy
      authors-mock-b:
          condition: service_healthy
      sections-mock:
          condition: service_healthy
      sections-mock-b:
          condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    image: yourorg/api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      book-service:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.2
    container_name: es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.2
    container_name: ls
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5000:5000"
      - "18081:18081"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.2
    container_name: kb
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"

volumes:
  esdata:
  pgdata:

