services:
  discovery-server:
    build:
      context: ./discovery-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16
    restart: always
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librarydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  authors-mock:
    image: wiremock/wiremock:3.6.0
    command: ["--port", "8080", "--verbose"]
    volumes:
      - ./stubs/authors:/home/wiremock
    ports:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  authors-mock-b:
    image: wiremock/wiremock:3.6.0
    command: ["--port", "8080", "--verbose"]
    volumes:
      - ./stubs/authors/b:/home/wiremock
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sections-mock:
    image: wiremock/wiremock:3.6.0
    command: ["--port", "8080", "--verbose"]
    volumes:
      - ./stubs/sections:/home/wiremock
    ports:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sections-mock-b:
    image: wiremock/wiremock:3.6.0
    command: ["--port", "8080", "--verbose"]
    volumes:
      - ./stubs/sections/b:/home/wiremock
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  book-service:
    build:
      context: ./digital-library
    restart: always
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      authors-mock:
        condition: service_healthy
      authors-mock-b:
        condition: service_healthy
      sections-mock:
        condition: service_healthy
      sections-mock-b:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker

      #DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-librarydb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      #Eureka for book-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      CLIENTS_AUTHORS_BASE_URL: lb://authors
      CLIENTS_SECTIONS_BASE_URL: lb://sections

      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_AUTHORS_0_URI: http://authors-mock:8080
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_AUTHORS_1_URI: http://authors-mock-b:8080
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_SECTIONS_0_URI: http://sections-mock:8080
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_SECTIONS_1_URI: http://sections-mock-b:8080

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  api-gateway:
    build:
      context: ./api-gateway
    image: yourorg/api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      book-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  pgdata:
