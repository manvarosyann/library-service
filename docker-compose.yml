networks:
  observability:
    driver: bridge

services:
  discovery-server:
    build:
      context: discovery-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [observability]

  postgres:
    image: postgres:16
    restart: always
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librarydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [observability]

  authors-mock:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/authors:/home/wiremock
    ports:
      - "8083:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [observability]

  authors-mock-b:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/authors/b:/home/wiremock
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [observability]

  sections-mock:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/sections:/home/wiremock
    ports:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [observability]

  sections-mock-b:
    image: wiremock/wiremock:3.6.0
    command: [ "--port", "8080", "--verbose" ]
    volumes:
      - ./stubs/sections/b:/home/wiremock
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/__admin || curl -sf http://localhost:8080/__admin >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [observability]

  auth-service:
    build: auth-service
    environment:
      SPRING_APPLICATION_NAME: auth-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      BOOKS_JWT_SECRET: "change-me-dev-secret-min-32-chars-min"
      SERVICE_CLIENT_ID: digital-library
      SERVICE_CLIENT_SECRET: dev-secret
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5000"
      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGGING_PATTERN_LEVEL: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}]"
    ports:
        - "8081:8081"
    networks: [observability]
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  book-service:
    build:
      context: digital-library
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/auth/**

      #DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-librarydb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      #Eureka for book-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      CLIENTS_AUTHORS_BASE_URL: lb://authors
      CLIENTS_SECTIONS_BASE_URL: lb://sections

      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_AUTHORS_0_URI: http://authors-mock:8080
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_AUTHORS_1_URI: http://authors-mock-b:8080
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_SECTIONS_0_URI: http://sections-mock:8080
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_SECTIONS_1_URI: http://sections-mock-b:8080

      BOOKS_JWT_SECRET: "super-secret-key-change-me-32-chars-min"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_SECRET_KEY: ${BOOKS_JWT_SECRET}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWS_ALGORITHM: HS256

      AUTH_BASE_URL: http://auth-service:8081

      BOOKS_SERVICE_CLIENT_SECRET: dev-secret

      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: DEBUG
      LOGGING_LEVEL_REACTOR_NETTY_HTTP_CLIENT: DEBUG

      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGGING_PATTERN_LEVEL: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}]"
    ports:
      - "8082:8080"
    networks: [observability]
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
          condition: service_healthy
      authors-mock:
          condition: service_healthy
      authors-mock-b:
          condition: service_healthy
      sections-mock:
          condition: service_healthy
      sections-mock-b:
          condition: service_healthy

  api-gateway:
    build:
      context: api-gateway
    image: yourorg/api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

      # Expose gateway actuator to inspect routes
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,gateway
      MANAGEMENT_ENDPOINT_GATEWAY_ENABLED: "true"

      # --- AUTH ROUTE (direct to service, with prefix strip) ---
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/auth/**

      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: DEBUG
      LOGGING_LEVEL_REACTOR_NETTY_HTTP_CLIENT: DEBUG

      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5000"

      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGGING_PATTERN_LEVEL: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}]"
    networks: [observability]
    depends_on:
      discovery-server:
        condition: service_started
      auth-service:
        condition: service_started
      book-service:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [observability]
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: ls
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5000:5000"
      - "9600:9600"
    volumes:
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    networks: [observability]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kb
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks: [observability]

volumes:
  es-data:
  pg-data: {}

