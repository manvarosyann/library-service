spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:librarydb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

books.jwt.secret=${BOOKS_JWT_SECRET:change-me-32+chars}

service-clients.digital-library.client-id=${SERVICE_CLIENT_ID:digital-library}
service-clients.digital-library.client-secret=${SERVICE_CLIENT_SECRET:${BOOKS_SERVICE_CLIENT_SECRET:change-me-32+chars}}

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

management.metrics.tags.application=${spring.application.name}

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=100ms,300ms,500ms,1s,2s,5s

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=B3

# Export to Zipkin in Docker
management.tracing.export.zipkin.enabled=true
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans

# (nice-to-have) put traceId/spanId in logs
logging.pattern.level=%5p [traceId=%X{traceId:-} spanId=%X{spanId:-}]

