spring.application.name=auth-service
server.port=8081

logging.level.org.springframework.security=DEBUG

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:librarydb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

books.jwt.secret=${BOOKS_JWT_SECRET:change-me-32+chars}

service-clients.digital-library.client-id=${SERVICE_CLIENT_ID:digital-library}
service-clients.digital-library.client-secret=${SERVICE_CLIENT_SECRET:${BOOKS_SERVICE_CLIENT_SECRET:change-me-32+chars}}

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true