# debug = true
spring.profiles.active=prod
spring.datasource.url=jdbc:postgresql://localhost:5432/librarydb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

my.values=apple-banana-cherry

my.date-formats[0]=yyyy-MM-dd
my.date-formats[1]=dd/MM/yyyy
my.date-formats[2]=MM-dd-yyyy
my.time-formats[0]=HH:mm:ss
my.time-formats[1]=hh:mm a

clients.authors.base-url=${CLIENTS_AUTHORS_BASE_URL:http://localhost:8081}
clients.sections.base-url=${CLIENTS_SECTIONS_BASE_URL:http://localhost:8082}


