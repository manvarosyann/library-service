spring.application.name=digital-library
server.port=8081
eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}
spring.datasource.url=jdbc:postgresql://postgres:5432/librarydb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
clients.authors.base-url=lb://authors
clients.sections.base-url=lb://sections
spring.cloud.discovery.client.simple.instances.authors[0].uri=http://authors-mock:8080
spring.cloud.discovery.client.simple.instances.authors[1].uri=http://authors-mock-b:8080
spring.cloud.discovery.client.simple.instances.sections[0].uri=http://sections-mock:8080
spring.cloud.discovery.client.simple.instances.sections[1].uri=http://sections-mock-b:8080
