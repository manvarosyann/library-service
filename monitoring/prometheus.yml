global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot'
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8081
          - book-service:8080

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
