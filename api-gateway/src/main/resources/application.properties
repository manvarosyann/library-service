# server config
server.port=8080
# application name
spring.application.name=api-gateway
# default filters
spring.cloud.gateway.default-filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
# routes - books-service
spring.cloud.gateway.routes[0].id=books
spring.cloud.gateway.routes[0].uri=lb://digital-library
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/books/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
# routes - authors-service
spring.cloud.gateway.routes[1].id=authors
spring.cloud.gateway.routes[1].uri=lb://authors-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/authors/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=^/api/authors/?(?<seg>.*), /${seg}
# eureka client
eureka.client.serviceUrl.defaultZone=${EUREKA_DEFAULT_ZONE:http://eureka:8761/eureka/}
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.instance.preferIpAddress=true
